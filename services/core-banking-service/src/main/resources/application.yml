server:
  port: 8080

spring:
  application:
    name: core-banking-service

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/trade_finance_db
    username: trade_user
    password: trade_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # MongoDB Configuration and Redis Configuration
  data:
    mongodb:
      uri: mongodb://trade_mongo_user:trade_mongo_password@localhost:27017/trade_finance_docs?authSource=admin
    redis:
      host: localhost
      port: 6379

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: trade-finance-core-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.bank.finance.*"

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# Zipkin Distributed Tracing
management.zipkin.tracing.endpoint: "http://localhost:9411/api/v2/spans"

# Security JWT Settings
app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24 hours
