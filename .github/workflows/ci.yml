name: Enterprise CI/CD Quality Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ====================================================
  # Job 1: Spring Boot Core Banking Quality Gate
  # ====================================================
  backend-quality-gate:
    name: Spring Boot (Java 17) Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trade_finance_db
          POSTGRES_USER: trade_user
          POSTGRES_PASSWORD: trade_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Unit/Integration Tests
        working-directory: services/core-banking-service
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean test
          elif [ -f "pom.xml" ]; then
            mvn clean test
          fi

  # ====================================================
  # Job 2: AI & OCR Microservice Quality Gate
  # ====================================================
  ai-agent-quality-gate:
    name: Python LangGraph & OCR Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install Python Dependencies & Lint
        working-directory: services/ai-agent-service
        run: |
          if [ -f "requirements.txt" ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install ruff pytest
            ruff check . || true
            pytest || true
          fi

  # ====================================================
  # Job 3: Next.js Frontend Quality Gate
  # ====================================================
  frontend-quality-gate:
    name: Next.js Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies & Typecheck
        working-directory: frontend
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm run lint || true
            npm run build || true
          fi
